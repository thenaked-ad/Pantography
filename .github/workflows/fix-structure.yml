name: One-off theme structure fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Tom Rea"
          git config user.email "tommyjrea@gmail.com"

      - name: Move stray asset files into assets/
        run: |
          mkdir -p assets
          moved=0
          for f in $(git ls-files | grep -v '/'); do
            case "$f" in
              README.md|.gitignore) continue ;;
            esac
            git mv -- "$f" "assets/$f"
            moved=$((moved+1))
          done
          echo "moved $moved files"
          git commit -q -m "Move asset files into assets/

          The GitHub web uploader caps at 100 files per upload, so the asset
          files landed at the repository root instead of inside assets/.
          Shopify's GitHub integration requires the standard theme folder
          structure and will not connect a repo without an assets/ directory.

          Pure renames. No file contents changed."

      - name: Remove this one-off workflow
        run: |
          git rm -r -q .github
          git commit -q -m "Remove one-off setup workflow"

      - name: Create dev with the segment search fix
        run: |
          git checkout -q -b dev
          python3 - <<'PY'
          import json, collections
          plans = {
            'templates/collection.stamps.json':      dict(handle='a-z',             label='FLOATING'),
            'templates/collection.flat-prints.json': dict(handle='flat-prints-a-z', label='FLAT'),
          }
          for path, plan in plans.items():
              raw = open(path, encoding='utf-8').read()
              d = json.loads(raw, object_pairs_hook=collections.OrderedDict)
              old, new_id = 'section_custom_html_fUGQwj', 'collection_search'
              assert old in d['sections'] and old in d['order'], path
              new_sec = collections.OrderedDict([("type","collection-search"),("settings",collections.OrderedDict([
                  ("collection", plan['handle']), ("heading",""),
                  ("search_label","Search %s"%plan['label']),
                  ("placeholder","Search by country or keyword"),
                  ("minimum_characters",2),
                  ("loading_text","Searching %s…"%plan['label']),
                  ("prompt_text","Enter at least [count] characters."),
                  ("one_result_text","1 result"), ("many_results_text","[count] results"),
                  ("no_results_text","No matching artworks in %s."%plan['label']),
                  ("error_text","The collection could not be searched. Please try again."),
                  ("from_text","From"), ("show_vendor",False), ("show_price",True),
                  ("columns_desktop",4), ("max_width",1300),
                  ("replace_original_grid",True),
                  ("original_grid_selector","#collection, .n6pg"),
                  ("background_color","#ffffff"), ("card_background_color","#ffffff"),
                  ("text_color","#111111"), ("accent_color","#111111"),
              ]))])
              d['sections'] = collections.OrderedDict(
                  (new_id if k==old else k, new_sec if k==old else v) for k,v in d['sections'].items())
              d['order'] = [new_id if x==old else x for x in d['order']]
              out = json.dumps(d, separators=(',',':'), ensure_ascii=False).replace('/', '\\/')
              open(path,'w',encoding='utf-8').write(out)
              a = json.loads(raw, object_pairs_hook=collections.OrderedDict)
              b = json.loads(out, object_pairs_hook=collections.OrderedDict)
              a['sections'].pop(old); a['order'].remove(old)
              b['sections'].pop(new_id); b['order'].remove(new_id)
              assert json.dumps(a,sort_keys=True)==json.dumps(b,sort_keys=True), 'unrelated change in '+path
              assert a['order']==b['order'], 'order changed in '+path
              print('ok', path)
          PY
          git add -A
          git commit -q -m "Scope FLOATING and FLAT search to their own segments

          Both collection templates carried the same custom-HTML block
          (section_custom_html_fUGQwj) containing a form with action=/search,
          paired with a /search/suggest.json call in Theme settings. Neither was
          scoped to a segment, so suggestions returned the whole catalogue and
          pressing Enter left the page for the site-wide search results.

          Replaces that block, in the same position, with the theme's existing
          but unused 'collection-search' section, which searches a single
          collection and renders results in place without navigating away.

          collection.stamps.json      (FLOATING) -> scoped to a-z
          collection.flat-prints.json (FLAT)     -> scoped to flat-prints-a-z"

      - name: Push
        run: |
          git push origin main
          git push origin dev

      - name: Summary
        run: |
          git checkout -q main
          echo "### Structure fixed" >> $GITHUB_STEP_SUMMARY
          for d in assets config layout locales sections snippets templates; do
            echo "- $d: $(git ls-files | grep -c "^$d/") files" >> $GITHUB_STEP_SUMMARY
          done
          echo "- stray files at root: $(git ls-files | grep -vc '/')" >> $GITHUB_STEP_SUMMARY
