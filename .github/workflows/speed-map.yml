name: Stamp Atlas speed fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Apply the change
        env:
          NEWFN_B64: ""
        run: |
          git config user.name "Tom Rea"
          git config user.email "tommyjrea@gmail.com"
          python3 - <<'PY'
          import base64, os, re

          # 1. map view: report the true page count
          p = 'templates/collection.map.liquid'
          s = open(p, encoding='utf-8').read()
          old = '  "next": {% if paginate.next %}true{% else %}false{% endif %}'
          new = old + ',\n  "pages": {{ paginate.pages }}'
          assert old in s, 'anchor not found in map view'
          assert '"pages"' not in s, 'already applied'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('ok:', p)

          # 2. atlas section: fan remaining pages out in one parallel wave
          p = 'sections/section-stamp-atlas.liquid'
          s = open(p, encoding='utf-8').read()
          a = '  function catalogPromiseFor(root) {'
          b = '  function prefetch(el) {'
          assert a in s and b in s, 'anchors not found'
          assert 'MAX_PAGES' not in s, 'already applied'
          block = base64.b64decode(os.environ['NEWFN_B64']).decode('utf-8')
          open(p, 'w', encoding='utf-8').write(s[:s.index(a)] + block + s[s.index(b):])
          print('ok:', p)

          # 3. syntax gate
          blocks = [x for x in re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', open(p, encoding='utf-8').read(), re.S) if 'catalogPromiseFor' in x]
          assert blocks, 'script block not found'
          open('/tmp/atlas.js', 'w').write(blocks[0])
          PY
          node --check /tmp/atlas.js
          echo "JavaScript parses cleanly"

      - name: Confirm map data untouched
        run: |
          echo "changed files:"; git diff --name-only
          test -z "$(git diff --name-only -- assets/)" && echo "assets/ untouched - map quality unchanged"

      - name: Commit and push
        run: |
          git add -A
          git commit -q -F - <<'MSG'
          Speed up Stamp Atlas: fetch catalogue pages in parallel

          The map does not draw until the whole catalogue has loaded, and the
          catalogue loaded pages 1-3 in parallel then chained pages 4..12 one
          at a time - up to nine sequential renders of 250 products each.

          collection.map.liquid now reports paginate.pages, so the client
          fetches every remaining page in a single parallel wave. Up to ten
          sequential round-trips become two.

          Falls back to the old sequential probe if a cached copy of the map
          view is served without the new field. Map data and rendering are
          untouched.
          MSG
          git push origin dev

      - name: Summary
        run: |
          echo "### Stamp Atlas speed fix applied to dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Round-trips before the map can draw: **up to 10 into 2**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git show --stat --format= HEAD >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "assets/ untouched - map resolution and rendering unchanged." >> $GITHUB_STEP_SUMMARY
